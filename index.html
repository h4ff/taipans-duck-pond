<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Taipans Duck Pond — v0.110</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main class="app-shell production-shell">
    <header class="production-toolbar">
      <div class="production-brand">
        <p class="eyebrow">Taipans Cricket Club</p>
        <h1>Duck Pond</h1>
      </div>

      <div class="production-week" aria-label="Choose club week">
        <label for="weekSelect">Club week</label>
        <select id="weekSelect" disabled></select>
        <span id="weekSummary" class="production-week-summary">Loading season…</span>
      </div>

      <div class="mobile-toolbar-actions production-mobile-actions" aria-label="Pond controls">
        <button id="mobileControlsToggle" type="button" hidden aria-expanded="false" aria-controls="developerControls">Test Controls</button>
        <button id="mobilePondToggle" type="button" class="secondary" aria-pressed="false">Expand Pond</button>
        <button id="mobileZoomReset" type="button" class="secondary" hidden>Reset Zoom</button>
      </div>
    </header>

    <!-- Development hooks remain in the DOM so the test architecture can be
         re-enabled later without carrying the test rig in the production UI. -->
    <div id="developerControls" class="controls developer-controls-hidden" hidden aria-hidden="true">
      <select id="playerSelect" disabled></select>
      <button id="addPlayerButton" type="button" disabled>Add Selected Player</button>
      <p id="playerIdentitySummary"></p>
      <button id="duckTypeButton" type="button" disabled>Duck Type</button>
      <button id="featherToneButton" type="button" disabled>Feather</button>
      <button id="buildVariantButton" type="button" disabled>Build</button>
      <button id="addMaleButton" type="button" disabled>Add Male</button>
      <button id="addFemaleButton" type="button" disabled>Add Female</button>
      <button id="load60Button" type="button" disabled>Load 60</button>
      <button id="testPresidentButton" type="button" disabled>President</button>
      <button id="testLeaderButton" type="button" disabled>Leader</button>
      <button id="testCaptainButton" type="button" disabled>Captain</button>
      <button id="testCoachButton" type="button" disabled>Coach</button>
      <button id="resetButton" type="button" disabled>Reset</button>
    </div>

    <section id="sceneFrame" class="scene-frame" aria-label="Interactive Taipan duck pond">
      <div id="scene" class="scene-viewport">
        <div id="worldStage" class="world-stage">
          <div id="world" class="scene-world">
        <img class="scene-background" src="assets/scene/background.png" alt="">

        <button id="liveScoreboard" class="live-scoreboard" type="button"
                aria-label="Open pond scoreboard" data-mode="leaderboard">
          <span id="scoreboardLabel" class="score-label">POND LEADERS</span>
          <strong id="scoreboardPrimary">0</strong>
          <span id="scoreboardSecondary" class="score-secondary">DUCKS IN POND</span>
          <span id="scoreboardMini1" class="score-mini"><b>1</b><span>—</span></span>
          <span id="scoreboardMini2" class="score-mini"><b>2</b><span>—</span></span>
          <span id="scoreboardMini3" class="score-mini"><b>3</b><span>—</span></span>
        </button>

        <div id="destinationMarker" class="destination-marker" hidden aria-hidden="true"></div>
        <div id="duckLayer" class="duck-layer"></div>

        <img class="foreground-layer near-bank"
             src="assets/scene/foreground-near-bank.png" alt="" aria-hidden="true">
        <img class="foreground-layer reeds"
             src="assets/scene/foreground-reeds.png" alt="" aria-hidden="true">
        <img class="foreground-layer pier-depth"
             src="assets/scene/pier-foreground.png" alt="" aria-hidden="true">

        <div id="splashLayer" class="splash-layer" aria-hidden="true"></div>
          </div>
        </div>
      </div>


      <div id="loadingOverlay" class="loading-overlay" role="status" aria-live="polite" aria-label="Loading pond assets">
        <div class="loading-card">
          <div class="loading-spinner" aria-hidden="true"></div>
          <strong id="loadingTitle">Loading pond…</strong>
          <span id="loadingProgress">0 / 104</span>
        </div>
      </div>


      <aside id="playerStatsCard" class="player-stats-card" hidden aria-live="polite">
        <button id="closePlayerStats" class="player-stats-close" type="button" aria-label="Close player stats">×</button>
        <p class="player-stats-kicker">PLAYER DUCK STATS</p>
        <h2 id="playerStatsName">Player</h2>
        <p id="playerStatsMeta" class="player-stats-meta"></p>
        <strong id="playerStatsSummary" class="player-stats-total">0 ducks this season</strong>
        <p id="playerStatsTypes" class="player-stats-types">0 standard • 0 golden • 0 diamond</p>
        <p id="playerStatsLatest" class="player-stats-latest">Latest: —</p>
      </aside>

      <div id="scoreboardPanel" class="scoreboard-panel" hidden>
        <button id="closeScoreboard" class="scoreboard-close" type="button"
                aria-label="Close scoreboard">×</button>
        <p id="panelWeekLabel">CLUB WEEK</p>
        <h2><span id="panelDuckCount">0</span> ducks in the pond</h2>
        <ol id="panelLeaderboard"></ol>
        <small>Season leaderboard through the selected club week.</small>
      </div>

    </section>


    <!-- Hidden development diagnostics. Kept as data sinks for the existing
         runtime, but no longer rendered in the production experience. -->
    <section id="dataDebugPanel" hidden aria-hidden="true">
      <p id="dataLoadStatus"></p>
      <p id="dataDebugRange"></p>
      <div id="dataLeaderboard"></div>
      <div id="dataWeekEvents"></div>
      <div id="dataPondEvents"></div>
    </section>
    <div id="status" hidden aria-live="polite"></div>
  </main>

  <script src="src/app.js"></script>
</body>
</html>
